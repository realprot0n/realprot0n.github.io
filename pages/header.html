<header class="main-header">
    <style>
        .main-header {
            width: 100%;
            max-width: 100%;
            padding-bottom: .25em;
            background: #2c0c3a;
        }
        .header-inside {
            padding: 15px;
            display: flex;
            float: left;
            align-items: center;
        }
        .img-logo {
            width: 64px;
            border-radius: 1em;
            border-style: solid;
            border-color: white;
            border-width: 2px;
            margin-right: 1em;
        }
        .header-nav {
            display: inline;
            color: #5d189e;
            font-size: 32px;
        }
        .header-nav a {
            font-size: 26px;
        }
        
        .song-player {
            padding-top: 1em;
            padding-right: 1em;
        }
        
        .song-player-images {
            height: 64px;
            display: inline-block;
            position: relative;
        }
        
        .song-player-main-img {
            max-height: 100%;
            image-rendering: pixelated;
            
            border-radius: 50%; /* make circular */
            border-color: white;
            border-style: solid;
            
            animation-name: song-player-spin;
            animation-duration: 2s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            animation-play-state: paused;
        }

        .song-player-svg {
            /* all this is to keep it centered in the image*/
            position: absolute;
            max-height: 60%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            
            filter: invert(1); /* make it white */
            opacity: 90%; /* make it more opaque at first; 60% is in the keyframes*/
            pointer-events: none; /* make mouse clicks pass through*/
            
            animation-duration: 1s;
            animation-timing-function: ease-in;
            animation-play-state: paused;
            animation-fill-mode: forwards;
        }
        
        @keyframes song-player-spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        
        @keyframes song-player-svg-fade-out {
            from {
                opacity: 60%;
            }
            to {
                opacity: 0%;
            }
        }
        
        @keyframes song-player-svg-fade-in {
            from {
                opacity: 0%;
            }
            to {
                opacity: 60%;
            }
        }
    </style>
    
    <div class="header-inside">
        <a href="/">
            <img class="img-logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTszSSFOsnTNohMc01M3mE6xiQvmNahkqUisaFxAa1jmjhTrz1_NjfzEkQ:https://pbs.twimg.com/profile_images/2035204327695163395/DUyxwHv4_400x400.jpg&s=10">
        </a>
        <nav class="header-nav">
            <a href="/">Home</a> &bull;
            <a href="/pages/about.html">About</a> &bull;
            <a href="/pages/projects.html">Projects</a> &bull;
            <a href="/pages/past_projects.html">Past</a>
        </nav>
    </div>

    <div class="song-player">
        <audio loop class="float-right" id="song-player" src="/sounds/The Sunset of 7 Suns (Sketch) ~ Toby Fox [ohBLWsjZD4w].mp3"></audio>
        <div class="song-player-images float-right">
            <img class="song-player-main-img" id="song-image" src="/images/The Sunset of 7 Suns (Sketch) ~ Toby Fox [ohBLWsjZD4w].png">
            <img class="song-player-svg" id="song-pause-play" src="/images/pause-button.svg">
        </div>
    </div>
    <br style="clear:both">
    <hr width="95%">
</header>
